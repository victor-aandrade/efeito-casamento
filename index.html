<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <title>Sinária & Edmário</title>

    <link rel="stylesheet" href="estilos/style.css">

</head>

<body>

    <main class="camera-container">

        <!-- CÂMERA -->
        <video
            id="camera"
            autoplay
            playsinline>
        </video>


        <!-- MOLDURA -->
        <img
            id="moldura"
            src="imagem/moldura.png"
            alt="Moldura do evento">


        <!-- INFORMAÇÕES -->
        <div class="mensagem">

        </div>


        <!-- CONTROLES -->

        <div class="controles">

            <!-- TROCAR CÂMERA -->

            <button
                id="trocarCamera"
                class="botao-secundario">

                🔄

            </button>


            <!-- ABRIR CÂMERA -->

            <button
                id="abrirCamera"
                class="botao-principal">

                📸

            </button>


            <!-- TIRAR FOTO -->

            <button
                id="tirarFoto"
                class="botao-principal oculto">

                📸

            </button>

        </div>


        <!-- CANVAS -->

        <canvas id="canvas"></canvas>

    </main>


    <script src="script/script.js"></script>

</body>

</html>
